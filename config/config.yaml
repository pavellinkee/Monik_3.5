routes:
  # Покупка и продажа у одного агрегатора. Архитектура это допускает при
  # явном разрешении (02_LEVEL1_SCANNER.md §18); основной моделью остаётся
  # кросс-провайдерный арбитраж. Включено для наблюдения: направление
  # почти наверняка убыточно — вход и выход идут по одной кривой
  # ликвидности, — но проверяется это замером, а не рассуждением.
  allow_same_provider: true
  allowed_pairs: []
  max_route_steps: 4

scanner:
  base_network: polygon
  base_token_address: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F"
  # Суммы задаются только конфигурацией (01_PROJECT_REQUIREMENTS.md §22).
  # Суммы, которыми Level 2 проверяет найденную возможность. Их число
  # произвольно и на стоимость поиска не влияет.
  amounts: ["50", "100", "1000"]

  level1:
    enabled: true
    # Сумма поиска. Level 1 работает одной суммой: остальные Level 2
    # подставляет в уже найденную возможность.
    amount: "50"
    interval_seconds: 600         # production interval — 10 минут
    overlap_policy: skip
    scan_timeout_seconds: 240
    top_tokens: 30
    max_opportunities_per_scan: 50
    max_concurrent_requests: 8
    quote_max_age_seconds: 30
    # Срок, в течение которого возможность можно проверять. Поднят до
    # десяти минут, чтобы проверка пережила ручную остановку сканера: при
    # восстановлении просроченное задание отменяется, а не начинается
    # заново. Возраст возможности при этом считается по календарю —
    # время простоя из него не вычитается.
    opportunity_ttl_seconds: 600
    deduplication_window_seconds: 300

  level2:
    enabled: true
    max_parallel: 20              # CLAUDE.md §18
    queue_capacity: 200
    # Срок жизни задания Level 2. Совпадает со сроком возможности: если
    # возможность истечёт раньше, задание останется без предмета проверки.
    job_ttl_seconds: 600
    confirmation_timeout_seconds: 60
    max_attempts: 3
    quote_max_age_seconds: 15

profitability:
  threshold_metric: net_roi
  # Порог подтверждения Level 2: возможность должна остаться выгодной на
  # свежих данных. Сравнение >=, ровно 0.01 % проходит.
  final_threshold_percent: "0.01"
  # Порог поиска Level 1: ниже него возможность не создаётся.
  preliminary_threshold_percent: "0.01"

fees:
  enabled: true
  refresh_on_startup: true
  refresh_interval_days: 1
  refresh_time: "02:00"
  freshness_seconds: 86400
  batch_enabled: true

# Gas и цены подключаются независимыми реализациями Provider (решение D-4).
gas:
  enabled: true
  # adapter_estimate — gas units из маршрута; rpc — цена газа из узла сети.
  # static используется только как явно настроенный fallback.
  # Порядок источников цены газа. quote — цена, пришедшая вместе с
  # котировкой агрегатора: лишнего запроса не требует, потому что
  # значение уже получено. rpc остаётся запасным на случай провайдера,
  # который цену не сообщает. adapter_estimate — расход газа из маршрута.
  sources: [quote, adapter_estimate, rpc]
  freshness_seconds: 60
  request_timeout_seconds: 5.0
  # static_wei_per_gas:
  #   polygon: 120000000000

prices:
  enabled: true
  sources: [aggregator_quote]
  freshness_seconds: 300
  request_timeout_seconds: 5.0

resources:
  global_max_concurrent_requests: 32
  provider_min_interval_seconds: 0.2
  queue_capacity: 1000
  queue_wait_timeout_seconds: 30.0
  default_request_timeout_seconds: 10.0
  lease_timeout_seconds: 60.0
  deduplicate_in_flight: true
  retry:
    max_attempts: 3               # CLAUDE.md §32
    initial_delay_seconds: 0.5
    max_delay_seconds: 30.0
    backoff_multiplier: 2.0
    jitter_ratio: 0.2
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout_seconds: 30.0
    half_open_max_calls: 1
    success_threshold: 2

scheduler:
  enabled: true
  tasks:
    level1_scan:
      mode: interval
      # Период задаётся в scanner.level1.interval_seconds и здесь не
      # дублируется: параметром управляют в одном месте. Указанное здесь
      # значение, расходящееся с настройкой подсистемы, остановит старт.
      overlap_policy: skip
    fee_refresh:
      mode: daily
      time: "02:00"
      timezone: "Europe/Lisbon"
      interval_days: 1
    capability_refresh:
      mode: startup
    # Напоминание о доступных, но не установленных обновлениях. Ничего
    # не устанавливает: автоматически ставятся только обновления
    # безопасности, остальные ждут решения оператора.
    system_updates:
      mode: daily
      time: "09:00"
      timezone: "Europe/Lisbon"
      interval_days: 1
    cleanup:
      mode: daily
      time: "03:30"
      timezone: "Europe/Lisbon"
      interval_days: 1

health:
  enabled: true
  check_interval_seconds: 60
  provider_degraded_threshold: 2     # порог перехода в DEGRADED
  provider_failure_threshold: 4      # порог перехода в UNAVAILABLE
  provider_recovery_threshold: 2     # гистерезис: порог восстановления
  worker_restart_limit: 3

notifications:
  enabled: true
  mode: A                         # A | B — влияет только на правила отправки
  language: ru
  decimal_places: 6
  queue_capacity: 500
  max_attempts: 5
  retry_initial_delay_seconds: 2.0
  retry_max_delay_seconds: 300.0
  deduplication_window_seconds: 3600
  show_calculation_version: false  # версия формулы в тексте уведомления
  # Значки уведомления о возможности. Значок агрегатора задан у самого
  # агрегатора, значок сети — у сети: свойство живёт там, где его владелец.
  emoji:
    pair: "💱"        # строка направления обмена
    best_roi: "⭐"     # сумма с наибольшим процентом доходности
    best_profit: "💎"  # сумма с наибольшей прибылью в базовом токене
    partial: "⚠️"      # сумма, не получившая подтверждения
    time: "⌚"        # время завершения проверки Level 2
  # Режим влияет ТОЛЬКО на правила отправки и не меняет Level 1 / Level 2.
  mode_a:
    send_confirmed: true
    send_partial: true
  mode_b:
    send_confirmed: true
    send_partial: true
  telegram:
    enabled: true
    bot_token: { env: "MONIK_TELEGRAM_BOT_TOKEN" }
    chat_id: { env: "MONIK_TELEGRAM_CHAT_ID" }
    api_base_url: "https://api.telegram.org"
    request_timeout_seconds: 10.0
    commands_enabled: true
    poll_interval_seconds: 2.0

database:
  # База вынесена за пределы каталога состояния: переход на следующую
  # версию не должен затрагивать историю. Каталог создаётся один раз и
  # принадлежит пользователю службы.
  path: "/var/lib/monik/monik.db"
  wal_enabled: true
  busy_timeout_seconds: 5.0
  integrity_check_on_startup: true
  cleanup_enabled: true
  retention:
    opportunities_days: 90
    jobs_days: 30
    notifications_days: 30
    scans_days: 14
    fee_snapshots_days: 30

logging:
  level: INFO
  directory: logs
  retention_days: 14

metrics:
  enabled: true
  collection_interval_seconds: 60
