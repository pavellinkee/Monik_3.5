# Monik — пример конфигурации.
#
# ВНИМАНИЕ: реальные секреты в этот файл не помещаются никогда.
# Credentials задаются ссылками на environment variables ({ env: "MONIK_..." })
# и разрешаются только Configuration subsystem (17_CONFIGURATION.md §5, §26, §46).
#
# Любой параметр можно переопределить переменной окружения с префиксом MONIK__,
# где путь внутри документа разделяется двойным подчёркиванием. Например:
#   MONIK__SCANNER__LEVEL1__INTERVAL_SECONDS=60
#   MONIK__APPLICATION__ENVIRONMENT=production
# Приоритет: environment override > этот файл > безопасный default.

application:
  environment: development        # development | test | production
  timezone: "Europe/Lisbon"
  shutdown_timeout_seconds: 30

# Сети. Круг всегда замыкается внутри одной сети: межсетевых сделок
# сканер не рассматривает (10_LEVEL_1_SCANNER.md §38). Поэтому базовый
# токен round-trip задаётся здесь, у сети, а не общей настройкой сканера.
# Сеть выключается собственным флагом enabled — тогда она не участвует в
# сканировании вовсе (02_LEVEL1_SCANNER.md §72).
networks:
  - network_id: polygon
    name: Polygon
    chain_id: 137
    native_token_symbol: POL
    native_token_decimals: 18
    wrapped_native_address: "0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270"
    # Базовый токен круга этой сети: вход и выход цикла.
    base_token_address: "0xc2132D05D31c914a87C6611C10748AEb04B58e8F"
    rpc_url: "https://polygon-bor-rpc.publicnode.com"
    # Значок сети в уведомлении Telegram.
    emoji: "⛓️"
    enabled: true

  - network_id: arbitrum
    name: Arbitrum
    chain_id: 42161
    native_token_symbol: ETH
    native_token_decimals: 18
    wrapped_native_address: "0x82aF49447D8a07e3bd95BD0d56f35241523fBab1"
    # USDT на Arbitrum. Адрес другой, чем на Polygon: одинаковый символ
    # не означает одинаковый контракт (01_PROJECT_REQUIREMENTS.md §11).
    base_token_address: "0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9"
    rpc_url: "https://arbitrum-one-rpc.publicnode.com"
    emoji: "🪀"
    enabled: true

# Провайдер включается только вместе с заданной переменной окружения
# для его ключа: enabled-провайдер без доступного секрета останавливает старт.
providers:
  - provider_id: oneinch
    enabled: false
    emoji: "🥏"
    ui_url: "https://app.1inch.io"
    supported_networks: [polygon]
    request_timeout_seconds: 10.0
    max_concurrent_requests: 1
    requests_per_second: 0.9

  - provider_id: zero_x
    emoji: "🔫"
    ui_url: "https://matcha.xyz"
    # Отключён: лимит запросов бесплатного плана исчерпан. Проверка
    # 14.09 показала, что он не восстановился — API снова ответил 403.
    # Возврат — по решению оператора, одной строкой.
    enabled: false
    # Покупка и продажа у этого агрегатора. Разрешение двухуровневое:
    # глобальное routes.allow_same_provider плюс согласие провайдера.
    allow_same_provider_round_trip: true
    api_key: { env: "MONIK_ZEROX_API_KEY" }
    requests_per_second: 4.9
    # 0x чаще остальных отвечает ошибкой частоты: за два часа наблюдения
    # 15 повторов против нуля у Velora и Uniswap. Пауза только для него,
    # общая остаётся 0.2 (resources.provider_min_interval_seconds).
    min_interval_seconds: 0.3
    # Часы работы. Вне окна агрегатор не опрашивается вовсе.
    schedule:
      start: "04:00"
      end: "23:00"
    supported_networks: [polygon]

  - provider_id: velora
    # Выключен по решению оператора 15.09: в работе остаётся только
    # Uniswap. Возврат — одной строкой.
    enabled: false
    emoji: "👾"
    ui_url: "https://app.velora.xyz"
    # Покупка и продажа у этого агрегатора. Разрешение двухуровневое:
    # глобальное routes.allow_same_provider плюс согласие провайдера.
    allow_same_provider_round_trip: true
    api_key: { env: "MONIK_VELORA_API_KEY" }
    # Документированный бесплатный тариф Velora — 1 запрос в секунду и
    # 5000 в сутки (velora.xyz/docs/integrate/rate-limits). Здесь по
    # решению оператора выставлено 4: суточный расход удерживает окно
    # работы, а частота проверяется опытом. При отказах 429 предохранитель
    # разведёт пробы по лестнице охлаждения.
    requests_per_second: 4.0
    # Пауза согласована с частотой: более строгое из двух ограничений и
    # определяет темп, поэтому прежняя секундная пауза свела бы настройку
    # частоты к одному запросу в секунду.
    min_interval_seconds: 0.25
    # Часы работы. Короткое окно бережёт суточную квоту бесплатного
    # тарифа: за 12 часов расход вдвое меньше, чем за сутки.
    schedule:
      start: "07:00"
      end: "19:00"
    # В учащённом проходе не участвует: при интервале 30 секунд он один
    # стоил бы 8640 запросов за окно при квоте 5000 в сутки.
    fast_scan: false
    # Только Polygon. API Velora работает и на Arbitrum, но суточная
    # квота бесплатного тарифа — 5000 запросов, а один Polygon уже
    # расходует около 44 за цикл. Вторая сеть удвоила бы расход без
    # запаса. Включение — одной строкой, когда появится платный тариф.
    supported_networks: [polygon]

  - provider_id: kyberswap
    # Выключен 16.09: в работе остаётся только Uniswap.
    enabled: false
    emoji: "🖲️"
    ui_url: "https://kyberswap.com/swap/"
    # Покупка и продажа у этого агрегатора. Разрешение двухуровневое:
    # глобальное routes.allow_same_provider плюс согласие провайдера.
    allow_same_provider_round_trip: true
    # Ключ доступа API не требует. Значение передаётся заголовком
    # x-client-id, которым приложение называет себя; на цену и на лимит
    # частоты оно не влияет — как X-Partner у Velora.
    api_key: { env: "MONIK_KYBERSWAP_API_KEY" }
    # Публичный лимит — 3 запроса в секунду, суточной квоты нет
    # (docs.kyberswap.com, раздел rate limits). Проба с частотой 4 дала 13
    # отказов по лимиту за 23 минуты, поэтому темп возвращён в рамки.
    requests_per_second: 3.0
    min_interval_seconds: 0.35
    # Часы работы. Вне окна агрегатор не опрашивается вовсе.
    schedule:
      start: "04:00"
      end: "23:00"
    supported_networks: [polygon, arbitrum]
    # Сеть зашита в адрес страницы обмена, поэтому общая ссылка привела
    # бы оператора не в ту сеть.
    ui_urls:
      polygon: "https://kyberswap.com/swap/polygon"
      arbitrum: "https://kyberswap.com/swap/arbitrum"

  - provider_id: uniswap
    enabled: true
    emoji: "🧩"
    ui_url: "https://app.uniswap.org/swap"
    # Покупка и продажа у этого агрегатора. Разрешение двухуровневое:
    # глобальное routes.allow_same_provider плюс согласие провайдера.
    allow_same_provider_round_trip: true
    api_key: { env: "MONIK_UNISWAP_API_KEY" }
    requests_per_second: 4.9
    # Часы работы. Вне окна агрегатор не опрашивается вовсе.
    schedule:
      start: "04:00"
      end: "23:00"
    supported_networks: [polygon, arbitrum]
    ui_urls:
      polygon: "https://app.uniswap.org/swap?chain=polygon"
      arbitrum: "https://app.uniswap.org/swap?chain=arbitrum"
    options:
      swapper: "0x4745ab81B8FD8C9ea6Af85980eEC6F23865576aB"

