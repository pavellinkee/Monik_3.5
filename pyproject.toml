[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monik"
version = "3.5.0"
description = "DEX arbitrage scanner"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "PyYAML>=6,<7",
    "aiosqlite>=0.20,<1",
]

[project.scripts]
monik = "monik.app.main:run"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.9,<1",
    "mypy>=1.13,<2",
    "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["monik"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
asyncio_mode = "auto"
markers = [
    "external: tests that require real external network access (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "^tests/",
]
